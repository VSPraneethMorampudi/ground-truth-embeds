  air=Array.from({length:Math.round(W*H/5200)},(_,i)=>{const z=i%3===0?1:.5;return{x:Math.random()*W,y:Math.random()*H,z,v:(z>.9?10:5)*rnd(.6,1.4),b:Math.random()<.5?1:0,a:rnd(.04,z>.9?.14:.07)}});
  // vignette and grain, made once
  vign=document.createElement("canvas");vign.width=W;vign.height=H;{const v=vign.getContext("2d"),g=v.createRadialGradient(W*.58,H*.5,Math.min(W,H)*.25,W*.58,H*.5,Math.hypot(W,H)*.62);
    g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.62)");v.fillStyle=g;v.fillRect(0,0,W,H)}

  fly=[];rip=[];sent=0;landed=0;done=false;
  if(REDUCE){cells.forEach(c=>c.on=1);sent=landed=cells.length;dists.forEach(d=>{d.got=d.total;d.done=-1e9});done=true;formedAt=-1e9;SRC.forEach(s=>s.count=Math.round(cells.length/3))}
  if(POSTER){const cut=.5;cells.forEach(c=>{if(c.order<cut){c.on=1;landed++;if(c.di>=0)dists[c.di].got++}});sent=cells.length;

  makeGlyphs()}

function portOf(s){return land?[s.x+s.r*1.3,s.y+rnd(-s.r*.45,s.r*.45)]:[s.x+rnd(-s.r*.55,s.r*.55),s.y+s.r*1.05+(TEXT?s.r*1.25:0)]}
function mkFly(c,now,u){const s=SRC[c.src],a=portOf(s);return{c,a,m:[(a[0]+c.x)/2+rnd(-24,24),(a[1]+c.y)/2+rnd(-34,34)],t:now,d:rnd(1100,1700),u,b:Math.random()<.5?1:0}}

function makeGlyphs(){glyph={};const f=L.font,sizes=[f,Math.round(f*.72)];
  [LAND,EDGE,...SRC.map(s=>s.col)].forEach(col=>sizes.forEach(z=>["0","1"].forEach(ch=>{const g=new OffscreenCanvas(Math.ceil(z*1.25*DPR),Math.ceil(z*1.45*DPR)),c=g.getContext("2d");
    c.scale(DPR,DPR);c.fillStyle=col;c.font=`600 ${z}px ${MONO}`;c.textAlign="center";c.textBaseline="middle";c.fillText(ch,z*.62,z*.74);glyph[col+z+ch]=g})))}
function digit(col,z,b,x,y,a){const g=glyph[col+z+b];if(!g||a<=.01)return;cx.globalAlpha=a;cx.drawImage(g,x-z*.62,y-z*.74,g.width/DPR,g.height/DPR)}
function blob(x,y,r,col,a){gx.globalAlpha=a;gx.fillStyle=col;gx.beginPath();gx.arc(x/3,y/3,r/3,0,6.283);gx.fill()}

/* source cards: they draw themselves in, breathe, and count what they have sent */
function card(s,i,T){
  const born=REDUCE||POSTER?1:clamp((T-.15-i*.18)/.7,0,1);if(born<=0)return;const r=s.r,e=easeOut(born);
  cx.save();cx.translate(s.x,s.y);
  const w=r*2.5,h=r*2,breathe=REDUCE?.5:.5+.5*Math.sin(T*2+i*1.3);
  cx.globalAlpha=e;cx.fillStyle=`rgba(${s.rgb},.07)`;rr(-w/2,-h/2,w,h,12);cx.fill();
  cx.shadowColor=s.col;cx.shadowBlur=10+12*breathe;cx.strokeStyle=s.col;cx.lineWidth=1.6;
  const per=2*(w+h);cx.setLineDash([per*e,per]);rr(-w/2,-h/2,w,h,12);cx.stroke();cx.setLineDash([]);cx.shadowBlur=0;
  // a scan line passing through the card while it is sending
  if(!done&&!REDUCE&&!POSTER&&T>1){const sy=-h/2+((T*.8+i*.33)%1)*h;cx.save();rr(-w/2,-h/2,w,h,12);cx.clip();const g=cx.createLinearGradient(0,sy-10,0,sy+10);g.addColorStop(0,`rgba(${s.rgb},0)`);g.addColorStop(.5,`rgba(${s.rgb},.22)`);g.addColorStop(1,`rgba(${s.rgb},0)`);cx.fillStyle=g;cx.fillRect(-w/2,sy-10,w,20);cx.restore()}
  cx.strokeStyle=s.col;cx.fillStyle=s.col;cx.lineWidth=1.7;cx.globalAlpha=e;
  if(s.key==="xls"){const iw=r*1.45,ih=r*1.05;cx.strokeRect(-iw/2,-ih/2,iw,ih);for(let k=1;k<3;k++){cx.beginPath();cx.moveTo(-iw/2+iw*k/3,-ih/2);cx.lineTo(-iw/2+iw*k/3,ih/2);cx.stroke()}
    for(let j=1;j<4;j++){cx.beginPath();cx.moveTo(-iw/2,-ih/2+ih*j/4);cx.lineTo(iw/2,-ih/2+ih*j/4);cx.stroke()}cx.globalAlpha=e*.35;cx.fillRect(-iw/2,-ih/2,iw,ih/4);
    if(!REDUCE&&!POSTER){const cell=Math.floor(T*3)%9,cxx=cell%3,cyy=1+Math.floor(cell/3);cx.globalAlpha=e*.5*breathe;cx.fillRect(-iw/2+iw*cxx/3,-ih/2+ih*cyy/4,iw/3,ih/4)}}
  if(s.key==="geo"){cx.font=`700 ${r*.88}px ${MONO}`;cx.textAlign="center";cx.textBaseline="middle";cx.fillText("{ }",0,-r*.06);cx.globalAlpha=e*.65;cx.font=`${r*.25}px ${MONO}`;cx.fillText('"Polygon"',0,r*.6)}
  if(s.key==="pg"){const ew=r*.74,eh=r*.21;for(let k=0;k<3;k++){const y=-r*.45+k*r*.42;cx.beginPath();cx.ellipse(0,y,ew,eh,0,0,6.283);cx.stroke();if(!REDUCE&&!POSTER&&Math.floor(T*2.5)%3===k){cx.globalAlpha=e*.25;cx.fill();cx.globalAlpha=e}}
    cx.beginPath();cx.moveTo(-ew,-r*.45);cx.lineTo(-ew,r*.39);cx.moveTo(ew,-r*.45);cx.lineTo(ew,r*.39);cx.stroke()}
  if(TEXT){cx.globalAlpha=e;cx.textAlign="center";cx.textBaseline="top";cx.fillStyle=INK;cx.font=`600 ${Math.max(12,r*.36)}px ${FONT}`;cx.fillText(s.name,0,r*1.15);
    cx.globalAlpha=e*.62;cx.font=`${Math.max(10.5,r*.27)}px ${FONT}`;cx.fillText(s.sub,0,r*1.15+Math.max(15,r*.42));
    cx.globalAlpha=e*.85;cx.fillStyle=s.col;cx.font=`${Math.max(10,r*.25)}px ${MONO}`;cx.fillText(String(s.count).padStart(4,"0")+" sent",0,r*1.15+Math.max(30,r*.8))}
  cx.restore();

function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

function land1(c,now){c.on=1;c.heat=1;landed++;SRC[c.src].count++;
  if(rip.length<70)rip.push({x:c.x,y:c.y,t:now,col:SRC[c.src].col});
  if(c.di>=0){const d=dists[c.di];d.got++;if(!d.done&&d.got>=d.total)d.done=now}}

function frame(now){
  const dt=Math.min(64,now-last);last=now;const T=(now-t0)/1000;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.globalCompositeOperation="source-over";cx.globalAlpha=1;
  gx.setTransform(1,0,0,1,0,0);gx.globalCompositeOperation="source-over";gx.clearRect(0,0,gl.width,gl.height);gx.globalCompositeOperation="lighter";
  // background
  const bg=cx.createRadialGradient(W*.6,H*.5,0,W*.6,H*.5,Math.max(W,H)*.75);bg.addColorStop(0,BG1);bg.addColorStop(1,BG0);cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  // data in the air, two depths
  const sm=Math.round(L.font*.72);for(const p of air){if(!REDUCE&&!POSTER){p.y+=p.v*dt/1000;if(p.y>H+10){p.y=-10;p.x=Math.random()*W}if(Math.random()<.002)p.b^=1}
    digit(LAND,p.z>.9?L.font:sm,p.b,p.x,p.y,p.a)}
  // faint lattice
  cx.globalAlpha=.045;cx.strokeStyle="#9fe8cc";cx.lineWidth=1;cx.beginPath();for(let x=L.cs*4;x<W;x+=L.cs*4){cx.moveTo(x,0);cx.lineTo(x,H)}for(let y=L.cs*4;y<H;y+=L.cs*4){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();

  cx.save();cx.translate(fx,fy);cx.scale(z,z);cx.translate(-fx,-fy);

  const trace=REDUCE||POSTER?1:clamp((T-.3)/1.4,0,1),fa=done?clamp((now-formedAt)/1200,0,1):0;
  if(fa<1){cx.globalAlpha=(1-fa)*(POSTER?.5:.42);cx.strokeStyle=EDGE;cx.lineWidth=1.3/mapT.k;
    if(trace<1){cx.setLineDash([outlineLen*easeOut(trace),outlineLen]);cx.stroke(statePath)}else{cx.setLineDash([4/mapT.k,5/mapT.k]);cx.stroke(statePath)}cx.setLineDash([])}
  // districts that have completed light up, then settle to a faint line
  dists.forEach((d,i)=>{if(!d.done)return;const age=(now-d.done)/1000,glow=age<1.4?1-age/1.4:0;
    cx.globalAlpha=.16+.6*glow;cx.strokeStyle=glow>0?EDGE:"#bff5df";cx.lineWidth=(1+1.6*glow)/mapT.k;cx.stroke(distPaths[i])});
  if(fa>0){cx.globalAlpha=fa;cx.strokeStyle=EDGE;cx.lineWidth=2/mapT.k;cx.stroke(statePath)}
  cx.restore();

  // 2 · emission
  if(!REDUCE&&!POSTER&&T>1.5){if(sent<cells.length){const n=Math.ceil(cells.length/6*dt/1000)+1;for(let i=0;i<n&&sent<cells.length;i++)fly.push(mkFly(cells[sent++],now))}
    else if(Math.random()<dt/220){const c=cells[Math.floor(Math.random()*cells.length)];fly.push(mkFly(c,now))}}
  // 3 · the map, digit by digit
  for(const c of cells){if(!c.on)continue;const tw=REDUCE?0:.12*Math.sin(T*1.4+c.tw),a=(c.edge?1:.58+((c.x*7+c.y*13)%10)/34)+tw;
    digit(c.edge?EDGE:LAND,L.font,c.b,c.x,c.y,clamp(a,.25,1));
    if(c.heat>0){digit(EDGE,L.font,c.b,c.x,c.y,c.heat);blob(c.x,c.y,L.cs*1.1,SRC[c.src].col,.35*c.heat);c.heat=Math.max(0,c.heat-dt/420)}
    else if(c.edge&&fa>0)blob(c.x,c.y,L.cs*.9,LAND,.08*fa)}
  if(!REDUCE&&!POSTER){const flips=Math.ceil(cells.length*.002);for(let i=0;i<flips;i++){const c=cells[Math.floor(Math.random()*cells.length)];if(c.on){c.b^=1;c.heat=Math.max(c.heat,.45)}}}
  // 4 · digits in flight, with a short trail
  for(let i=fly.length-1;i>=0;i--){const f=fly[i],fixed=f.u!==undefined,u=fixed?f.u:(now-f.t)/f.d;
    if(u>=1){if(f.c.on){f.c.b=f.b;f.c.heat=1;SRC[f.c.src].count++}else land1(f.c,now);f.c.b=f.b;fly.splice(i,1);continue}
    const e=fixed?u:ease(u),s=SRC[f.c.src],p=quad(f.a,f.m,[f.c.x,f.c.y],e),zz=e>.55?L.font:sm,a=.35+.65*Math.sin(Math.min(1,u*1.2)*Math.PI*.5);
    for(let k=1;k<=2;k++){const q=quad(f.a,f.m,[f.c.x,f.c.y],Math.max(0,e-.035*k));digit(s.col,sm,f.b,q[0],q[1],a*.22/k)}
    digit(s.col,zz,fixed?f.b:((u*12|0)%2?f.b:1-f.b),p[0],p[1],a);blob(p[0],p[1],L.cs*.7,s.col,.18*a)}
  // 5 · landing ripples
  for(let i=rip.length-1;i>=0;i--){const r=rip[i],u=(now-r.t)/480;if(u>=1){rip.splice(i,1);continue}
    cx.globalAlpha=.5*(1-u);cx.strokeStyle=r.col;cx.lineWidth=1.2;cx.beginPath();cx.arc(r.x,r.y,L.cs*(.3+1.4*easeOut(u)),0,6.283);cx.stroke()}
  // 6 · the finish: a band of light sweeps across the state, and keeps returning now and then
  if(done&&!REDUCE){const since=(now-formedAt)/1000,cyc=since<3?since:((since-3)%9);
    if(cyc<1.6){const u=cyc/1.6,bx=mapT.mx-120+(mapT.mw+240)*u;
      cx.save();cx.setTransform(DPR*z*mapT.k,0,0,DPR*z*mapT.k,DPR*(fx-z*(fx-mapT.ox)),DPR*(fy-z*(fy-mapT.oy)));cx.clip(statePath);cx.setTransform(DPR,0,0,DPR,0,0);
      cx.translate(fx,fy);cx.scale(z,z);cx.translate(-fx,-fy);const g=cx.createLinearGradient(bx-90,0,bx+90,0);g.addColorStop(0,"rgba(220,255,241,0)");g.addColorStop(.5,"rgba(220,255,241,.22)");g.addColorStop(1,"rgba(220,255,241,0)");
      cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(bx-90,0,180,H);cx.restore()}}
  // district names, briefly, as each one completes

    const live=dists.filter(d=>d.done>0&&d.at&&(now-d.done)<2200).sort((a,b)=>b.done-a.done).slice(0,3);
    live.forEach(d=>{const age=(now-d.done)/1000,a=age<.25?age/.25:age>1.6?1-(age-1.6)/.6:1,lift=(1-easeOut(Math.min(1,age/.5)))*L.cs*.8,t=d.n.toUpperCase(),w=cx.measureText(t).width;
      cx.globalAlpha=a;cx.shadowColor="#020806";cx.shadowBlur=8;cx.fillStyle=EDGE;cx.fillText(t,d.at[0],d.at[1]+lift);cx.shadowBlur=0;
      cx.globalAlpha=a*.7;cx.fillStyle=LAND;cx.fillRect(d.at[0]-w/2*easeOut(Math.min(1,age/.4)),d.at[1]+L.cs*.62+lift,w*easeOut(Math.min(1,age/.4)),1)})}
  cx.restore();gx.restore();

  // 7 · source cards, above the streams
  SRC.forEach((s,i)=>card(s,i,T));
  // 8 · bloom: the glow buffer, upscaled, added on top
  cx.globalCompositeOperation="lighter";cx.globalAlpha=1;cx.imageSmoothingEnabled=true;cx.drawImage(gl,0,0,W,H);cx.globalAlpha=.6;cx.drawImage(gl,-W*.01,-H*.01,W*1.02,H*1.02);cx.globalCompositeOperation="source-over";
  // 9 · HUD and title
  if(TEXT)hud(now,T,prog,fa);
  // 10 · lens: vignette and grain
  cx.globalAlpha=1;cx.drawImage(vign,0,0);if(!REDUCE){cx.globalAlpha=.5;const ox=Math.random()*192|0,oy=Math.random()*192|0;cx.fillStyle=cx.createPattern(grain,"repeat");cx.save();cx.translate(-ox,-oy);cx.fillRect(ox,oy,W,H);cx.restore()}
  if(!done&&landed>=cells.length){done=true;formedAt=now}

function hud(now,T,prog,fa){
  const a=REDUCE||POSTER?1:clamp((T-.6)/.6,0,1);if(a<=0)return;
  const bw=Math.min(220,W*.3),bx=land?SRC[0].x-bw/2:W/2-bw/2,by=land?H-Math.max(28,H*.06):H-Math.max(22,H*.035);
  const fin=done&&!POSTER,lab=fin?(bw<200?"MAP READY":"MAP READY · 27 DISTRICTS"):"ASSEMBLING MAP",pct=Math.round(prog*100);
  cx.globalAlpha=a*(fin?.75:1);cx.textBaseline="bottom";cx.font=`600 10.5px ${MONO}`;cx.fillStyle=fin?EDGE:"#9fe8cc";cx.textAlign="left";cx.fillText(lab,bx,by-6);cx.textAlign="right";cx.fillText(pct+"%",bx+bw,by-6);
  cx.fillStyle="rgba(159,232,204,.15)";cx.fillRect(bx,by,bw,2);let x=bx;SRC.forEach((s,i)=>{const share=cells.filter(c=>c.on&&c.src===i).length/cells.length;cx.fillStyle=s.col;cx.fillRect(x,by,bw*share,2);x+=bw*share});
  // title card when the map is complete: beside the map when there is room, otherwise a lower-third banner
  if(fin||REDUCE){const u=REDUCE?1:clamp((now-formedAt-600)/900,0,1);if(u<=0)return;const e=easeOut(u),k=mapT.k;
    const mr=mapT.ox+k*(mapT.bb.x+mapT.bb.w),room=W-mr-56,T1="CHHATTISGARH",T2="3 sources · 27 districts · one map";
    const fit=(max,avail)=>{cx.font=`700 ${max}px ${FONT}`;const w=cx.measureText(T1).width*1.2+max*.18*11;return Math.max(14,Math.min(max,max*avail/w))};
    let big,tx,ty,side=land&&room>=180;
    if(side){big=fit(44,room);tx=mr+32;ty=mapT.oy+k*(mapT.bb.y+mapT.bb.h*.62);cx.textAlign="left"}
    else{const mc=land?mapT.ox+k*(mapT.bb.x+mapT.bb.w/2):W/2,span=land?Math.min(W-48,k*mapT.bb.w*1.3):W-48;big=fit(34,span);tx=clamp(mc,span/2+24,W-span/2-24);ty=land?mapT.oy+k*(mapT.bb.y+mapT.bb.h*.86):H*.83;cx.textAlign="center";
      cx.save();cx.translate(tx,ty-big*.2);cx.scale(span*.62,big*1.9);const g=cx.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,"rgba(3,11,9,.85)");g.addColorStop(.6,"rgba(3,11,9,.6)");g.addColorStop(1,"rgba(3,11,9,0)");cx.globalAlpha=e;cx.fillStyle=g;cx.beginPath();cx.arc(0,0,1,0,6.283);cx.fill();cx.restore()}
    cx.textBaseline="alphabetic";cx.globalAlpha=e*.8;cx.font=`600 ${Math.max(9,big*.26)}px ${MONO}`;cx.fillStyle=LAND;cx.fillText("LOCATION FORMED",tx,ty-big*1.05);
    cx.globalAlpha=e;cx.fillStyle=INK;cx.font=`700 ${big}px ${FONT}`;
    if("letterSpacing" in cx)cx.letterSpacing=(big*.18*(1+(1-e)*1.5))+"px";cx.shadowColor=LAND;cx.shadowBlur=18;cx.fillText(T1,tx,ty);cx.shadowBlur=0;const tw=cx.measureText(T1).width;if("letterSpacing" in cx)cx.letterSpacing="0px";
    const rw=Math.min(tw,W-32)*e,rx=side?tx:tx-rw/2;cx.globalAlpha=e*.8;const rg=cx.createLinearGradient(rx,0,rx+rw,0);rg.addColorStop(0,side?LAND:"rgba(95,227,179,0)");rg.addColorStop(.5,LAND);rg.addColorStop(1,"rgba(95,227,179,0)");cx.fillStyle=rg;cx.fillRect(rx,ty+big*.28,rw,1.2);
    cx.globalAlpha=e*.75;cx.fillStyle=INK;cx.font=`${Math.max(11,big*.32)}px ${FONT}`;cx.fillText(T2,tx,ty+big*.28+Math.max(14,big*.5))}}

let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();last=performance.now();if(REDUCE||POSTER)frame(performance.now())},150)});
document.fonts.load('16px "GitLab Mono"').catch(()=>{}).finally(()=>{layout();requestAnimationFrame(frame)});
</script>
