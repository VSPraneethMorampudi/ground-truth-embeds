<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ground Truth · Chhattisgarh State Geoportal</title>
<meta name="description" content="From orbit to the ground: how Chhattisgarh turns places into reliable digital maps. An interactive story in English and Hindi.">
<meta name="theme-color" content="#04090b">
<link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-tight-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/lenis.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="loading">
<a class="skip" href="#ground">Skip the flight</a>

<div id="pre" aria-hidden="true">
  <div class="pre-in"><div class="pre-n"><span id="preN">00</span><small>%</small></div>
  <div class="pre-l"><span lang="en">Acquiring signal</span><span lang="hi">संकेत प्राप्त हो रहा है</span></div>
  <div class="pre-bar"><i id="preBar"></i></div></div>
</div>

<div id="cur" aria-hidden="true"><i class="dot"></i><i class="ring"><b id="curL"></b></i></div>
<div id="grain" aria-hidden="true"></div>

<header id="top">
  <a class="brand" href="#orbit" data-magnet><span class="logo"></span><span lang="en">Ground Truth</span><span lang="hi">ज़मीनी सच्चाई</span></a>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language">
      <button data-setlang="en" aria-pressed="true">EN</button><button data-setlang="hi" aria-pressed="false">हिं</button>
    </div>
    <button class="pill" id="playBtn" data-play data-magnet><i class="pl"></i><span lang="en">Play the story</span><span lang="hi">कहानी चलाएँ</span><em>3:00</em></button>
  </div>
</header>

<nav id="rail" aria-label="Chapters"></nav>

<section id="orbit" aria-label="Opening: from orbit to Raipur">
  <div class="ostick">
    <canvas id="globe" aria-hidden="true"></canvas>
    <div class="hud" aria-hidden="true">
      <div class="hud-p"><b>SAT · CG-GEO 01</b><span>ALT <em id="hAlt">35,786 km</em></span><span>LAT <em id="hLat">21.25° N</em></span><span>LON <em id="hLon">81.63° E</em></span></div>
      <div class="hud-s"><span lang="en">Mission: find the ground truth</span><span lang="hi">मिशन: ज़मीनी सच खोजें</span><div class="hud-bar"><i id="hScan"></i></div></div>
    </div>
    <div class="lock" aria-hidden="true"><b>RAIPUR</b><span>21.25° N · 81.63° E</span><em lang="en">Target locked</em><em lang="hi">लक्ष्य तय</em></div>
    <div class="ocaps" id="ocaps"></div>
    <div class="otitle">
      <p class="kick" id="oKick"></p>
      <h1 id="oTitle"></h1>
      <p class="osub" id="oSub"></p>
      <div class="obtns"><a class="btn" href="#ground" data-magnet id="oBegin"></a><button class="btn ghost" data-play data-magnet id="oPlay"></button></div>
    </div>
    <div class="ocue" aria-hidden="true"><i></i><span lang="en">Scroll to descend</span><span lang="hi">नीचे उतरने के लिए स्क्रॉल करें</span></div>
  </div>
</section>

<main id="ground"></main>

<div id="ap" hidden role="region" aria-label="Auto-play">
  <button id="apPrev" aria-label="Previous">⏮</button><button id="apPlay" class="main" aria-label="Pause">❚❚</button><button id="apNext" aria-label="Next">⏭</button>
  <div class="ap-mid"><div class="ap-top"><span id="apLab"></span><span class="ap-hint"></span><span id="apTime">0:00 / 3:00</span></div><div id="apSegs"></div></div>
  <button id="apFull" aria-label="Full screen">⛶</button><button id="apStop" aria-label="Stop auto-play">✕</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="geo.js"></script>
<script src="content.js"></script>
<script src="globe.js"></script>
<script src="app.js"></script>
</body>
</html>
