      const c1=land?[a[0]+(mx-a[0])*.4,a[1]+rnd(-12,12)]:[a[0]+rnd(-12,12),a[1]+(my-a[1])*.5];
      const c2=land?[mx-mw*.04+rnd(-25,25),tgt.y+rnd(-30,30)]:[tgt.x+rnd(-25,25),my-mh*.02];
      strands.push({si,a,c1,c2,end:[tgt.x,tgt.y],ph:Math.random()*6.28})}});
  cells.forEach(c=>{const opts=strands.filter(t=>t.si===c.src);c.st=opts.reduce((b,t)=>Math.hypot(t.end[0]-c.x,t.end[1]-c.y)<Math.hypot(b.end[0]-c.x,b.end[1]-c.y)?t:b)});
  // constellation behind everything
  nodes=Array.from({length:Math.round(W*H/26000)},()=>({x:Math.random()*W,y:Math.random()*H,vx:rnd(-.06,.06),vy:rnd(-.06,.06),r:rnd(.8,1.8)}));
  fly=[];sent=0;done=false;
  if(REDUCE){cells.forEach(c=>c.on=1);sent=cells.length;done=true;formedAt=-1e9}
  if(POSTER){const cut=.52;cells.forEach(c=>c.on=c.order<cut?1:0);sent=cells.length;
    const wait=cells.filter(c=>!c.on);for(let i=0;i<Math.min(2600,wait.length*2.4);i++){const c=wait[Math.floor(Math.random()*wait.length)];fly.push(mkFly(c,0,Math.random()*.94+.03))}
    for(let i=0;i<700;i++){const c=cells[Math.floor(Math.random()*cells.length)];fly.push(mkFly(c,0,Math.random()*.7))}}
  makeGlyphs()}

// a point on the panel's right edge (or bottom edge on phones), after the panel's tilt
function edgePoint(s,f){const land=W/H>1.05,lx=land?s.w:f*s.w,ly=land?f*s.h*.84+s.h*.12:s.h;return[s.x+lx*s.sx,s.y+ly+lx*s.sk]}
function mkFly(c,now,u){const t=c.st,a=[t.a[0]+rnd(-3,3),t.a[1]+rnd(-3,3)];return{c,a,c1:[t.c1[0]+rnd(-8,8),t.c1[1]+rnd(-8,8)],c2:[t.c2[0]+rnd(-16,16),t.c2[1]+rnd(-16,16)],t:now,d:rnd(1500,2400),u,b:Math.random()<.5?1:0}}

function makeGlyphs(){glyph={};const f=L.font,sz=[f,Math.round(f*.8)];
  [MAP,EDGE,...SRC.map(s=>s.col)].forEach(col=>sz.forEach(z=>["0","1"].forEach(ch=>{const g=new OffscreenCanvas(Math.ceil(z*1.3*DPR),Math.ceil(z*1.5*DPR)),c=g.getContext("2d");
    c.scale(DPR,DPR);c.fillStyle=col;c.shadowColor=col;c.shadowBlur=z*.5;c.font=`600 ${z}px "GitLab Mono",ui-monospace,Menlo,Consolas,monospace`;c.textAlign="center";c.textBaseline="middle";c.fillText(ch,z*.65,z*.75);glyph[col+z+ch]=g})))}
function digit(col,z,b,x,y,a){const g=glyph[col+z+b];if(!g)return;cx.globalAlpha=a;cx.drawImage(g,x-z*.65,y-z*.75,g.width/DPR,g.height/DPR)}

/* glass panels, tilted as if standing in space */
function panel(s,a){cx.save();cx.setTransform(DPR*s.sx,DPR*s.sk,0,DPR,DPR*s.x,DPR*s.y);
  const w=s.w,h=s.h,r=10;
  cx.globalAlpha=a;cx.shadowColor=s.col;cx.shadowBlur=24;cx.fillStyle="rgba(10,30,50,.66)";rr(0,0,w,h,r);cx.fill();cx.shadowBlur=0;
  const g=cx.createLinearGradient(0,0,w,h);g.addColorStop(0,"rgba(255,255,255,.10)");g.addColorStop(.5,"rgba(255,255,255,.02)");g.addColorStop(1,"rgba(255,255,255,.06)");cx.fillStyle=g;rr(0,0,w,h,r);cx.fill();
  cx.strokeStyle=s.col;cx.globalAlpha=a*.85;cx.lineWidth=1.3;rr(0,0,w,h,r);cx.stroke();
  cx.globalAlpha=a;cx.fillStyle="rgba(255,255,255,.06)";cx.fillRect(1,1,w-2,h*.13);[0,1,2].forEach(i=>{cx.beginPath();cx.arc(12+i*11,h*.065,3.2,0,6.3);cx.fillStyle=i===0?s.col:"rgba(255,255,255,.25)";cx.fill()});
  const fs=Math.max(7.5,w*.034);cx.font=`500 ${fs}px "GitLab Mono",ui-monospace,monospace`;cx.fillStyle="rgba(230,245,255,.85)";cx.textBaseline="middle";cx.fillText(s.title,48,h*.067);
  const n=s.key==="xls"?ROWS.length+1:s.key==="geo"?GJ.length:SQL.length,top=h*.16,lh=(h-top-6)/n;cx.font=`${Math.min(fs*.95,lh*.8)}px "GitLab Mono",ui-monospace,monospace`;
  if(s.key==="xls"){const cols=[.03,.41,.61,.80],hd=["centre_id","lat","lon","district"];
    cx.fillStyle="rgba(61,220,132,.16)";cx.fillRect(1,top,w-2,lh);
    hd.forEach((t,i)=>{cx.fillStyle=s.col;cx.fillText(t,w*cols[i],top+lh/2)});
    ROWS.forEach((row,j)=>{const y=top+lh*(j+1.5);cx.strokeStyle="rgba(255,255,255,.07)";cx.beginPath();cx.moveTo(1,y+lh/2);cx.lineTo(w-1,y+lh/2);cx.stroke();
      row.forEach((t,i)=>{cx.fillStyle=i===0?"rgba(230,245,255,.9)":"rgba(200,230,255,.7)";cx.fillText(t,w*cols[i],y)})});
    [.39,.59,.78].forEach(f=>{cx.strokeStyle="rgba(255,255,255,.08)";cx.beginPath();cx.moveTo(w*f,top);cx.lineTo(w*f,h-4);cx.stroke()})}
  if(s.key==="geo")GJ.forEach((t,j)=>{cx.fillStyle=/"[a-z_]+":/.test(t)?s.col:"rgba(225,240,255,.8)";cx.fillText(t,10,top+lh*(j+.5))});
  if(s.key==="pg")SQL.forEach((t,j)=>{cx.fillStyle=/^(SELECT|FROM)|ST_/.test(t.trim())?s.col:j>=4?"rgba(200,230,255,.7)":"rgba(225,240,255,.85)";cx.fillText(t,10,top+lh*(j+.5))});
  cx.restore();
  if(LABELS&&W/H>1.05){cx.save();cx.setTransform(DPR,0,0,DPR,0,0);cx.globalAlpha=a;cx.textAlign="left";cx.textBaseline="middle";cx.fillStyle=s.col;
    cx.font=`700 ${Math.max(11,s.w*.042)}px "Avenir Next World","Avenir Next",system-ui,sans-serif`;cx.shadowColor="#000";cx.shadowBlur=6;
    cx.fillText(s.tag.toUpperCase(),s.x+6,s.y-10);cx.restore()}}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

function frame(now){
  const dt=Math.min(64,now-last);last=now;const T=(now-t0)/1000;cx.setTransform(DPR,0,0,DPR,0,0);cx.globalCompositeOperation="source-over";
  const g=cx.createRadialGradient(W*.62,H*.45,0,W*.62,H*.45,Math.max(W,H)*.8);g.addColorStop(0,BG1);g.addColorStop(1,BG0);cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // constellation
  cx.lineWidth=.6;if(!REDUCE&&!POSTER)for(const n of nodes){n.x+=n.vx*dt/16;n.y+=n.vy*dt/16;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1}
  for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){cx.globalAlpha=(1-d/130)*.18;cx.strokeStyle="#5fb6ff";cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
    cx.globalAlpha=.4;cx.fillStyle="#8fd0ff";cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.3);cx.fill()}
  cx.globalCompositeOperation="lighter";
  // the ribbons: thin lines of light along every strand
  const rib=POSTER?1:REDUCE?.6:Math.min(1,T/1.2);
  for(const t of strands){const s=SRC[t.si],gr=cx.createLinearGradient(t.a[0],t.a[1],t.end[0],t.end[1]);gr.addColorStop(0,s.col);gr.addColorStop(.55,s.col);gr.addColorStop(1,MAP);
    const pulse=.75+.25*Math.sin(T*1.6+t.ph);cx.strokeStyle=gr;cx.beginPath();cx.moveTo(t.a[0],t.a[1]);cx.bezierCurveTo(t.c1[0],t.c1[1],t.c2[0],t.c2[1],t.end[0],t.end[1]);
    cx.lineWidth=5;cx.globalAlpha=.06*rib*pulse;cx.stroke();cx.lineWidth=1.2;cx.globalAlpha=.32*rib*pulse;cx.stroke()}
  // emission: first the whole state, then a steady trickle of updates
  if(!REDUCE&&!POSTER&&T>.8){if(sent<cells.length){const n=Math.ceil(cells.length/5.5*dt/1000)+1;for(let i=0;i<n&&sent<cells.length;i++)fly.push(mkFly(cells[sent++],now))}
    else if(fly.length<480)for(let i=0;i<Math.ceil(dt/12);i++)fly.push(mkFly(cells[Math.floor(Math.random()*cells.length)],now))}
  // digits riding the ribbons, in their source's colour until they reach the map
  const big=L.font,sm=Math.round(L.font*.8);
  for(let i=fly.length-1;i>=0;i--){const f=fly[i],fixed=f.u!==undefined,u=fixed?f.u:(now-f.t)/f.d;if(u>=1){f.c.on=1;f.c.b=f.b;f.c.heat=1;fly.splice(i,1);continue}
    const e=fixed?u:ease(u),p=bez(f.a,f.c1,f.c2,[f.c.x,f.c.y],e),col=e<.62?SRC[f.c.src].col:MAP;
    digit(col,e<.5?sm:big,fixed?f.b:((u*14|0)%2?f.b:1-f.b),p[0],p[1],.3+.7*Math.sin(Math.min(1,u*1.15)*Math.PI*.5))}
  // the map, digit by digit
  let landed=0;for(const c of cells){if(!c.on)continue;landed++;
    const tw=REDUCE?0:.16*Math.sin(T*1.3+c.tw),a=(c.edge?1:.55+((c.x*7+c.y*13)%10)/45)+tw;
    digit(c.edge?EDGE:MAP,big,c.b,c.x,c.y,clamp(a,.2,1));
    if(c.heat>0){digit(EDGE,big,c.b,c.x,c.y,c.heat);c.heat=Math.max(0,c.heat-dt/450)}}
  if(!REDUCE&&!POSTER){const flips=Math.ceil(cells.length*.002);for(let i=0;i<flips;i++){const c=cells[Math.floor(Math.random()*cells.length)];if(c.on){c.b^=1;c.heat=.6}}}
  if(!done&&landed===cells.length){done=true;formedAt=now}
  // the outline: dashed while forming, then a bright glowing border with the district lines
  cx.save();cx.setTransform(DPR*mapT.k,0,0,DPR*mapT.k,DPR*mapT.ox,DPR*mapT.oy);
  const fa=done?Math.min(1,(now-formedAt)/1400):0;
  cx.globalAlpha=POSTER?.55:(1-fa)*.35*Math.min(1,T/1.2);cx.strokeStyle=MAP;cx.lineWidth=1.3/mapT.k;cx.setLineDash([5/mapT.k,5/mapT.k]);cx.stroke(statePath);cx.setLineDash([]);
  if(fa>0){cx.globalAlpha=.2*fa;cx.strokeStyle=MAP;cx.lineWidth=.8/mapT.k;distPaths.forEach(p=>cx.stroke(p));
    cx.shadowColor=MAP;cx.shadowBlur=26*DPR;cx.globalAlpha=.55*fa;cx.lineWidth=6/mapT.k;cx.strokeStyle=MAP;cx.stroke(statePath);
    cx.shadowBlur=8*DPR;cx.globalAlpha=fa;cx.lineWidth=2.2/mapT.k;cx.strokeStyle=EDGE;cx.stroke(statePath)}
  cx.restore();cx.globalCompositeOperation="source-over";
  // panels last, so the ribbons appear to leave them
  SRC.forEach((s,i)=>panel(s,POSTER||REDUCE?1:clamp(T*1.5-i*.25,0,1)));
  if(!REDUCE&&!POSTER)requestAnimationFrame(frame)}

let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();last=performance.now();if(REDUCE||POSTER)frame(performance.now())},150)});
document.fonts.load('16px "GitLab Mono"').catch(()=>{}).finally(()=>{layout();requestAnimationFrame(frame)});
</script>
</body>
</html>
