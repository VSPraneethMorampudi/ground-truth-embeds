    for(let j=1;j<4;j++){cx.beginPath();cx.moveTo(-w/2,-h/2+h*j/4);cx.lineTo(w/2,-h/2+h*j/4);cx.stroke()}cx.globalAlpha=a*.35;cx.fillRect(-w/2,-h/2,w,h/4)}
  if(s.key==="geo"){cx.font=`700 ${r*.9}px "GitLab Mono",ui-monospace,monospace`;cx.textAlign="center";cx.textBaseline="middle";cx.fillText("{ }",0,-r*.05);
    cx.globalAlpha=a*.6;cx.font=`${r*.26}px "GitLab Mono",ui-monospace,monospace`;cx.fillText('"Polygon"',0,r*.6)}
  if(s.key==="pg"){const w=r*.75,h=r*.22;for(let i=0;i<3;i++){const y=-r*.45+i*r*.42;cx.beginPath();cx.ellipse(0,y,w,h,0,0,Math.PI*2);cx.stroke()}
    cx.beginPath();cx.moveTo(-w,-r*.45);cx.lineTo(-w,r*.39);cx.moveTo(w,-r*.45);cx.lineTo(w,r*.39);cx.stroke()}
  if(SHOW_LABELS){cx.globalAlpha=a;cx.fillStyle="#e8f5ef";cx.textAlign="center";cx.textBaseline="top";cx.font=`600 ${Math.max(12,r*.36)}px "Avenir Next World","Avenir Next",system-ui,sans-serif`;cx.fillText(s.name,0,r*1.15);
    cx.globalAlpha=a*.6;cx.font=`${Math.max(10.5,r*.28)}px "Avenir Next World","Avenir Next",system-ui,sans-serif`;cx.fillText(s.sub,0,r*1.15+Math.max(15,r*.42))}
  cx.restore()}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

/* emission: every cell is fetched once by a digit flying from its source */
function emit(now,dt){
  const T=(now-t0)/1000;if(T<.9||sent>=cells.length)return;
  const rate=cells.length/6.2,n=Math.min(cells.length-sent,Math.ceil(rate*dt/1000*1.0+Math.random()));
  for(let i=0;i<n;i++){const c=cells[sent++],s=SRC[c.src];
    const mxp=(s.x+c.x)/2+rnd(-60,60),myp=(s.y+c.y)/2+rnd(-90,90);
    const lx=W/H>1.05,ex=lx?s.x+s.r*1.3:s.x+rnd(-s.r,s.r),ey=lx?s.y+rnd(-s.r*.8,s.r*.8):s.y+s.r*1.05+(SHOW_LABELS?s.r*1.2:0);
    flying.push({c,s,sx:ex,sy:ey,mx:mxp,my:myp,t:now,d:rnd(1000,1700),b:Math.random()<.5?1:0})}}

function frame(now){
  const dt=Math.min(64,now-last);last=now;const T=(now-t0)/1000;
  // background
  const g=cx.createRadialGradient(W*.62,H*.52,0,W*.62,H*.52,Math.max(W,H)*.75);g.addColorStop(0,BG1);g.addColorStop(1,BG0);cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // a faint lattice: the grid every digit sits on
  cx.globalAlpha=.05;cx.strokeStyle="#9fe8cc";cx.lineWidth=1;cx.beginPath();for(let x=L.cs*4;x<W;x+=L.cs*4){cx.moveTo(x,0);cx.lineTo(x,H)}for(let y=L.cs*4;y<H;y+=L.cs*4){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();
  const srcA=REDUCE?1:Math.min(1,T/.8);
  if(!done&&!REDUCE)emit(now,dt);
  // landed digits; a few flip each frame, the map is live data, not a picture
  const flips=REDUCE?0:Math.ceil(cells.length*.0025);for(let i=0;i<flips;i++){const c=cells[Math.floor(Math.random()*cells.length)];if(c.land)c.b^=1,c.flash=1}
  for(const c of cells){if(!c.on)continue;const a=c.edge?1:.62+((c.x*7+c.y*13)%10)/32;
    if(c.land<1){c.land=Math.min(1,c.land+dt/350)}
    const col=c.land<1?SRC[c.src].col:(c.edge?EDGE:LAND);digit(col,c.b,c.x,c.y,a*(c.flash?1:1));if(c.flash){c.flash=Math.max(0,c.flash-dt/400);if(c.flash>0)digit(EDGE,c.b,c.x,c.y,c.flash*.8)}}
  // digits in flight, coloured by the source they came from
  for(let i=flying.length-1;i>=0;i--){const f=flying[i];let u=(now-f.t)/f.d;if(u>=1){f.c.on=1;f.c.b=f.b;flying.splice(i,1);continue}
    const e=ease(u),x=(1-e)*(1-e)*f.sx+2*(1-e)*e*f.mx+e*e*f.c.x,y=(1-e)*(1-e)*f.sy+2*(1-e)*e*f.my+e*e*f.c.y;
    digit(f.s.col,(u*12|0)%2?f.b:1-f.b,x,y,.35+.65*Math.sin(u*Math.PI))}
  if(!done&&sent>=cells.length&&!flying.length){done=true;window.__formed=now}
  // once the map has formed: the real state outline and district lines come up
  const fa=done?(REDUCE?1:Math.min(1,(now-(window.__formed||now))/1500)):0;
  if(fa>0){cx.save();cx.setTransform(DPR*mapT.k,0,0,DPR*mapT.k,DPR*mapT.ox,DPR*mapT.oy);
    cx.globalAlpha=.22*fa;cx.strokeStyle="#bff5df";cx.lineWidth=.9/mapT.k;distPaths.forEach(p=>cx.stroke(p));
    cx.globalAlpha=.85*fa;cx.strokeStyle=EDGE;cx.lineWidth=1.6/mapT.k;cx.shadowColor=LAND;cx.shadowBlur=12;cx.stroke(statePath);cx.restore()}
  SRC.forEach(s=>drawSource(s,srcA*(done?.85:1)));
  // after it forms, the sources keep sending small updates, as the portal does
  if(done&&!REDUCE&&Math.random()<dt/260){const c=cells[Math.floor(Math.random()*cells.length)];const s=SRC[Math.floor(Math.random()*3)];c.src=SRC.indexOf(s);
    const lx=W/H>1.05;flying.push({c,s,sx:lx?s.x+s.r*1.3:s.x,sy:lx?s.y:s.y+s.r*1.05+(SHOW_LABELS?s.r*1.2:0),mx:(s.x+c.x)/2+rnd(-60,60),my:(s.y+c.y)/2+rnd(-90,90),t:now,d:rnd(1200,1800),b:Math.random()<.5?1:0});c.land=0}
  if(!REDUCE)requestAnimationFrame(frame)}

let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();if(REDUCE)frame(performance.now())},150)});
document.fonts.load('16px "GitLab Mono"').catch(()=>{}).finally(()=>{layout();requestAnimationFrame(frame)});
</script>
</body>
