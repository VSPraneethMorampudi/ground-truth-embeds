<title>Ground Truth · new data and updates</title>
<!--
  Two StoryMap embeds on one page, picked by the hash:
    expressmaps.html#new      New data creation: a road traced from a satellite photo, a drone survey area,
                              new houses and a new centre located on a GPS visit
    expressmaps.html#update   Keeping data current: a widened road, a school that moved, a demolished building
  Options: &auto=off shows the finished map without the animation.
  Base: roads, blocks and buildings hand-traced from OpenStreetMap (© OpenStreetMap contributors, ODbL).
  Everything drawn in colour on top is illustrative.
-->
<style>

:root{

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.fig{position:relative;height:100%;min-height:380px;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:10px;background:var(--ground)}
svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.lab{font-family:var(--font);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.lab.sub{font-weight:400}

.legend b{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 7px 4px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legend li{display:grid;grid-template-columns:28px 1fr;align-items:center;column-gap:10px;min-height:22px;padding:0 4px;color:var(--ink);opacity:.3;transition:opacity .35s;cursor:default}
.legend li.on{opacity:1}
.legend svg{display:block;overflow:visible}
.legend li:focus-visible{outline:2px solid var(--pin);outline-offset:2px;border-radius:3px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.rep{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);font:500 13px var(--font);border-radius:6px;padding:5px 10px;cursor:pointer;opacity:0;transition:opacity .3s;pointer-events:none}
.rep.on{opacity:1;pointer-events:auto}
.rep:hover{color:var(--ink);border-color:#c1bfbe}
.rep:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
.f{transition:opacity .25s}
.stage[data-f] .f{opacity:.18}
.stage[data-f] .f.hi{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

const NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const OPT=Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(s=>{const[k,v]=s.split("=");return[k,v===undefined?true:decodeURIComponent(v)]}));
const MODE=OPT.update?"update":"new";
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let FAST=false;
function tween(ms,fn){return new Promise(r=>{if(REDUCE||FAST||ms<=0){fn(1);return r()}const t0=performance.now();const st=n=>{const t=Math.min(1,(n-t0)/ms);fn(ease(t));t<1?requestAnimationFrame(st):r()};requestAnimationFrame(st)})}
const wait=ms=>new Promise(r=>setTimeout(r,REDUCE||FAST?0:ms));

/* ================================================================ FIGURES */
const ovl=()=>el("g",{},S);
const LABS=[];
function lab(p,x,y,t,c,sz=19,sub){const e=el("text",{x,y,class:"lab"+(sub?" sub":""),"font-size":sz,fill:c},p);e.textContent=t;e.dataset.sz=sz;LABS.push(e);return e}
function pin(p,x,y,c){const g=el("g",{transform:`translate(${x} ${y})`},p);el("ellipse",{cx:0,cy:1,rx:7,ry:2.6,fill:"rgba(0,0,0,.18)"},g);
  const h=el("g",{},g);el("path",{d:"M0,0 C-14,-20 -16,-28 -16,-34 A16,16 0 1 1 16,-34 C16,-28 14,-20 0,0Z",fill:c,stroke:"#fff","stroke-width":2},h);el("circle",{cx:0,cy:-34,r:6,fill:"#fff"},h);return{g,h}}
const dash=(e)=>{e.setAttribute("pathLength",1);e.setAttribute("stroke-dasharray",1);e.setAttribute("stroke-dashoffset",1);return e};

const FIG={
 new:{
  vb:[760,250,800,520],title:"Added to the map",

   el("path",{d:"M930,342 L1428,424 L1452,512 L1308,690 L874,638 L892,470 Z",fill:"var(--survey-fill)",stroke:"var(--survey)","stroke-width":3,"stroke-dasharray":"12 8","stroke-linejoin":"round"},F.survey);

     el("rect",{x:-15,y:-10,width:30,height:20,fill:"var(--new-fill)",stroke:"var(--new)","stroke-width":2.4},g);g.style.transform="scale(0)";return g});

     async()=>{F.gps.setAttribute("opacity",1);await tween(520,t=>P.h.setAttribute("transform",`translate(0 ${(-60*(1-t)).toFixed(1)})`))}],

 update:{

   const ah=el("path",{d:"M396,276 L383,283 L395,293",fill:"none",stroke:"#1f2328","stroke-width":3,"stroke-linecap":"round","stroke-linejoin":"round",opacity:0},F.moved);
   const pg=el("g",{opacity:0},F.moved);const P=pin(pg,360,292,"var(--pin)");lab(pg,384,256,"School, new site","#2b44b5");lab(pg,384,236,"moved 2025","#2b44b5",15,1);
   F.gone=el("g",{class:"f",opacity:0},o);

   const X=[dash(el("path",{d:"M725,438 L753,456",stroke:"var(--gone)","stroke-width":3.6,"stroke-linecap":"round"},F.gone)),dash(el("path",{d:"M753,438 L725,456",stroke:"var(--gone)","stroke-width":3.6,"stroke-linecap":"round"},F.gone))];
   const gl=el("g",{opacity:0},F.gone);lab(gl,718,488,"Building demolished","#b11");lab(gl,718,510,"removed from the map","#b11",15,1);
   const doomed=[...document.querySelectorAll("#bldgs path")].filter(p=>p.getAttribute("d").startsWith("M726,440"));
   return{F,steps:[
     async()=>{band.setAttribute("opacity",1);await tween(900,t=>{band.setAttribute("stroke-width",(13+11*t).toFixed(1));cl.setAttribute("stroke-dashoffset",1-t)});await tween(250,t=>F.rl.setAttribute("opacity",t))},
     async()=>{await tween(400,t=>F.old.setAttribute("opacity",t));await tween(800,t=>ar.setAttribute("stroke-dashoffset",1-t));ah.setAttribute("opacity",1);pg.setAttribute("opacity",1);await tween(500,t=>P.h.setAttribute("transform",`translate(0 ${(-60*(1-t)).toFixed(1)})`))},
     async()=>{F.gone.setAttribute("opacity",1);for(const x of X)await tween(260,t=>x.setAttribute("stroke-dashoffset",1-t));await tween(500,t=>doomed.forEach(d=>d.setAttribute("opacity",1-t*.85)));await tween(250,t=>gl.setAttribute("opacity",t))}],
    keys:["road","moved","gone"],extra:{moved:["old"]},
    reset(){band.setAttribute("opacity",0);band.setAttribute("stroke-width",13);cl.setAttribute("stroke-dashoffset",1);F.rl.setAttribute("opacity",0);F.old.setAttribute("opacity",0);ar.setAttribute("stroke-dashoffset",1);ah.setAttribute("opacity",0);pg.setAttribute("opacity",0);P.h.setAttribute("transform","translate(0 -60)");
      F.gone.setAttribute("opacity",0);X.forEach(x=>x.setAttribute("stroke-dashoffset",1));gl.setAttribute("opacity",0);doomed.forEach(d=>d.setAttribute("opacity",1))}}}}};

/* ================================================================ RUN */
const fig=FIG[MODE],stage=document.getElementById("stage"),rep=document.getElementById("rep");
document.title="Ground Truth · "+(MODE==="new"?"new data":"keeping data current");
document.getElementById("desc").textContent=fig.desc;document.getElementById("note").textContent=fig.note;
document.getElementById("lgT").textContent=fig.title;
const lis=fig.legend.map(L=>{const li=document.createElement("li");li.tabIndex=0;li.innerHTML=L.sw+`<span>${L.t}</span>`;li.dataset.k=L.k;document.getElementById("lgL").appendChild(li);return li});
// fit the figure's window into the frame, keeping its centre in view
function fit(){const[x,y,w,h]=fig.vb,r=stage.clientWidth/stage.clientHeight,ar=w/h;let W=w,H=h;
  if(r>ar)W=h*r;else H=w/r;
  // labels: never smaller than about 13 px (titles) and 11 px (second lines) on screen
  const k=W/stage.clientWidth,small=k>1.5;LABS.forEach(e=>{const b=+e.dataset.sz,sub=b<19;e.style.display=small&&sub?"none":"";e.setAttribute("font-size",Math.max(b,12.5*k).toFixed(1));e.style.strokeWidth=Math.max(5,3*k)+"px"});
  S.setAttribute("viewBox",`${(x+w/2-W/2).toFixed(1)} ${(y+h/2-H/2).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}`)}
base();const run=fig.build();addEventListener("resize",fit);
const keys=run.keys||fig.legend.map(l=>l.k),F=run.F;
// legend hover/focus spotlights a feature
fit();
lis.forEach(li=>{const k=li.dataset.k,on=()=>{if(!li.classList.contains("on"))return;stage.dataset.f=k;
    const group=(run.extra&&Object.entries(run.extra).find(([,v])=>v.includes(k)))?.[0];
    Object.entries(F).forEach(([n,g])=>g.classList&&g.classList.toggle("hi",!!(n===k||n===group||(run.extra&&run.extra[k]&&run.extra[k].includes(n)))))},
  off=()=>{delete stage.dataset.f};li.addEventListener("pointerenter",on);li.addEventListener("pointerleave",off);li.addEventListener("focus",on);li.addEventListener("blur",off)});
let token=0;
async function play(){const me=++token;rep.classList.remove("on");run.reset();lis.forEach(l=>l.classList.remove("on"));
  const legendFor=i=>{const k=keys[i];lis.forEach(l=>{if(l.dataset.k===k||(run.extra&&run.extra[k]&&run.extra[k].includes(l.dataset.k)))l.classList.add("on")})};
  await wait(350);
  for(let i=0;i<run.steps.length;i++){if(me!==token)return;legendFor(i);await run.steps[i]();await wait(450)}
  if(me===token)rep.classList.add("on")}
async function finish(){FAST=true;run.reset();lis.forEach(l=>l.classList.add("on"));for(const f of run.steps)await f();FAST=false;rep.classList.add("on")}
rep.onclick=()=>play();
document.fonts.load('700 19px "Avenir Next World"').catch(()=>{}).then(()=>{
  if(OPT.auto==="off"||REDUCE){finish();return}
  new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){o.disconnect();play()}},{threshold:.35}).observe(stage)});
addEventListener("hashchange",()=>location.reload());
</script>
</body>
